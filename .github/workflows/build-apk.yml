name: Build Signed Android APK from URL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova App & Generate Key
      run: |
        cordova create myapp com.app.paramedical2 "Paramedical"
        cd myapp
        cordova platform add android
        sed -i 's|<content src="index.html" />|<content src="https://magenta-halva-f17420.netlify.app/" />|g' config.xml
        sed -i 's|<allow-intent href="http://\*/*" />|<allow-navigation href="*" />|g' config.xml
        
        # إنشاء مفتاح التوقيع داخل المجلد
        keytool -genkeypair -v -keystore release-key.jks -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Paramedical, OU=Dev, O=App, L=City, S=State, C=DZ"
        
        # إنشاء ملف إعدادات التوقيع الخاص بـ Cordova
        cat <<EOF > build.json
        {
          "android": {
            "release": {
              "keystore": "release-key.jks",
              "storePassword": "password123",
              "alias": "my-alias",
              "password": "password123",
              "keystoreType": "",
              "packageType": "apk"
            }
          }
        }
        EOF

    - name: Build Signed Release APK
      run: |
        cd myapp
        cordova build android --release --buildConfig=build.json

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Paramedical-Signed-APK
        path: myapp/platforms/android/app/build/outputs/apk/release/app-release.apk
