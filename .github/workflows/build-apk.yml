name: Build Signed Android APK from URL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova & Android Build Tools
      run: |
        npm install -g cordova
        sudo apt-get update
        sudo apt-get install -y google-android-cmdline-tools-11.0-installer android-sdk

    - name: Create Cordova App
      run: |
        cordova create myapp com.app.paramedical2 "Paramedical"
        cd myapp
        cordova platform add android
        sed -i 's|<content src="index.html" />|<content src="https://magenta-halva-f17420.netlify.app/" />|g' config.xml
        sed -i 's|<allow-intent href="http://\*/*" />|<allow-navigation href="*" />|g' config.xml

    - name: Build Unsigned APK
      run: |
        cd myapp
        cordova build android --release

    - name: Generate Key & Sign APK
      run: |
        cd myapp/platforms/android/app/build/outputs/apk/release
        keytool -genkey -v -keystore my-release-key.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Paramedical, OU=Dev, O=App, L=City, S=State, C=DZ"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks my-release-key.keystore --ks-pass pass:password123 --key-pass pass:password123 --out Paramedical-Signed.apk app-release-unsigned.apk

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Paramedical-Signed-APK
        path: myapp/platforms/android/app/build/outputs/apk/release/Paramedical-Signed.apk
